name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: todo-app

jobs:
  backend:
    name: バックエンド（PHPUnit）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite, sqlite3
          coverage: none

      - name: Composer のキャッシュ
        uses: actions/cache@v6
        with:
          path: ~/.composer/cache/files
          key: composer-${{ hashFiles('todo-app/composer.lock') }}
          restore-keys: composer-

      - name: 依存パッケージのインストール
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: 環境設定
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: テスト
        run: php artisan test

  frontend:
    name: フロントエンド（型チェック・Lint・テスト・ビルド）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: todo-app/package-lock.json

      - name: 依存パッケージのインストール
        run: npm ci

      - name: 型チェック
        run: npx tsc --noEmit

      - name: Lint・フォーマット（Biome）
        run: npx biome ci --reporter=github

      - name: テスト（フロントエンド）
        run: npm test

      - name: ビルド
        run: npx vite build

  e2e:
    name: E2E（Playwright）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite, sqlite3
          coverage: none

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: todo-app/package-lock.json

      - name: Composer のキャッシュ
        uses: actions/cache@v6
        with:
          path: ~/.composer/cache/files
          key: composer-${{ hashFiles('todo-app/composer.lock') }}
          restore-keys: composer-

      - name: 依存パッケージのインストール
        run: |
          composer install --no-interaction --no-progress --prefer-dist
          npm ci

      - name: 環境設定
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: ブラウザのインストール
        run: npx playwright install --with-deps chromium

      - name: E2E テスト
        run: npm run test:e2e

      - name: 失敗したときのレポートを保存
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            todo-app/playwright-report
            todo-app/test-results
          retention-days: 7
